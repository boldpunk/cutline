# One-click deploy to Render: https://render.com/deploy?repo=https://github.com/boldpunk/cutline
# Creates the site and a PostgreSQL database. Every start applies migrations;
# `npm start` then rebuilds the fictional demo salon (/demo) with fresh bookings
# (the prestart hook, active when RENDER or SEED_SHOWCASE is set). Real salons,
# registered at /start, are never touched.
services:
  - type: web
    name: cutline
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: TRUST_PROXY
        value: "true"
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cutline-db
          property: connectionString

databases:
  - name: cutline-db
    plan: free
    region: frankfurt
    databaseName: cutline
    user: cutline
